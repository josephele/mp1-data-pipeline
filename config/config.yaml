validation:
  required_columns:
    - name
    - category
    - status 
    - record_id
    - rating
  numeric_columns:
    - record_id
    - rating
processing:
  remove_duplicates: true
  missing:
    enabled: true
    axis: "rows"
  outliers:
    enabled: true
    columns:
      - rating # replace this with new numeric colum 
    method: "iqr"
    threshold: 1.5 